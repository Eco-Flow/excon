name: nf-test

# Every nf-test (the module tests and the full test_chlamydia pipeline test,
# tests/default.nf.test), laid out as in the nf-core pipeline template:
#
#   nf-test-changes  works out which tests a pull request touches
#                    (nf-test --changed-since HEAD^, plus the files listed under
#                    `triggers` in nf-test.config, which run everything) and how
#                    many shards to split them over
#   nf-test          runs each shard on each engine / Nextflow version
#   confirm-pass     one result to require in branch protection
#
# A pull request runs only the tests related to what it changes; most code
# changes touch main.nf or a trigger file, so they run everything, including the
# ~1 h pipeline test. Releases and manual runs (gh workflow run nf-test.yml
# --ref <branch>) always run everything. Docs-only changes skip this workflow;
# linting.yml still runs.
#
# Matrix: Docker with the minimum Nextflow (nextflow.config's nextflowVersion)
# and with latest-everything (allowed to fail: a warning, not a failed check),
# and Singularity (Apptainer) with the minimum.

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NFT_VER: 0.9.5
  NXF_ANSI_LOG: false
  # Read by tests/nextflow.config, so every test shares one image cache
  NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
  # Pull requests and pushes: only the related tests. Releases / manual runs: all.
  NFT_CHANGED: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '--changed-since HEAD^' || '' }}

jobs:
  nf-test-changes:
    name: nf-test-changes
    runs-on: ubuntu-latest
    outputs:
      shard: ${{ steps.shards.outputs.shard }}
      total_shards: ${{ steps.shards.outputs.total_shards }}
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: 26.04.6

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v2.1.0
        with:
          version: ${{ env.NFT_VER }}

      - name: Count the related tests, and shards to run them on
        id: shards
        run: |
          # shellcheck disable=SC2086  # NFT_CHANGED is empty or two words, unquoted on purpose
          out=$(nf-test test --profile +docker --dry-run --ci $NFT_CHANGED 2>&1) || {
            echo "$out"; echo "::error::nf-test --dry-run failed"; exit 1; }
          echo "$out"
          shard="[]"; total=0
          if ! echo "$out" | grep -q 'No tests to execute'; then
            n=$(echo "$out" | sed -n 's|.*Executed \([0-9]*\) tests.*|\1|p')
            if [ -n "$n" ] && [ "$n" -gt 0 ]; then
              total=$(( n < 7 ? n : 7 ))
              shard=$(seq 1 "$total" | jq -R . | jq -c -s .)
            fi
          fi
          echo "shard=$shard" >> "$GITHUB_OUTPUT"
          echo "total_shards=$total" >> "$GITHUB_OUTPUT"
          echo "Shards: $shard (total $total)"

  nf-test:
    name: "${{ matrix.profile }} | ${{ matrix.NXF_VER }} | ${{ matrix.shard }}/${{ needs.nf-test-changes.outputs.total_shards }}"
    needs: [nf-test-changes]
    if: ${{ needs.nf-test-changes.outputs.total_shards != '0' }}
    runs-on: ubuntu-latest
    # The pipeline test takes ~1 h on a 4-CPU runner (CAFE's k-sweep runs serially)
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.nf-test-changes.outputs.shard) }}
        profile: [docker, singularity]
        NXF_VER: ["26.04.6", "latest-everything"]
        exclude:
          - profile: singularity
            NXF_VER: latest-everything
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Free disk space for container images
        if: matrix.profile == 'singularity'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ matrix.NXF_VER }}

      - name: Install nf-test
        # From nf-test's GitHub releases; the code.askimed.com installer stopped resolving
        uses: nf-core/setup-nf-test@v2.1.0
        with:
          version: ${{ env.NFT_VER }}

      - name: Install Apptainer (provides the singularity command)
        if: matrix.profile == 'singularity'
        # v2 installs a .deb that needs libfuse3-3, which current runners lack
        uses: eWaterCycle/setup-apptainer@v3.0.0
        with:
          apptainer-version: 1.5.5

      - name: Download Nextflow's plugins, retrying
        # Each test starts Nextflow, which downloads its plugins (nf-schema and others)
        # on first use, and a failed download fails that test. A launch with --help
        # fetches them all into ~/.nextflow without running anything, so do that first.
        run: |
          for i in 1 2 3 4 5; do
            nextflow -q run main.nf -profile test,${{ matrix.profile }} --help > /dev/null && exit 0
            echo "Attempt $i failed; retrying in 30 s"
            sleep 30
          done
          echo "::warning::Could not download Nextflow's plugins; each test will try again."

      - name: Download the Singularity images, retrying
        if: matrix.profile == 'singularity'
        # Image downloads (quay.io, depot.galaxyproject.org) sometimes break off and
        # fail whichever test needed the image. utils/pull_singularity_images.sh fetches
        # every image the pipeline uses into the cache, under the names Nextflow looks
        # for, and a re-run fetches only those still missing.
        run: |
          for i in 1 2 3; do
            utils/pull_singularity_images.sh "$NXF_SINGULARITY_CACHEDIR" && exit 0
            echo "Attempt $i left images missing; retrying in 30 s"
            sleep 30
          done
          echo "::warning::Some Singularity images could not be downloaded; the tests will try again."

      - name: Run nf-test
        id: run_nf_test
        continue-on-error: ${{ matrix.NXF_VER == 'latest-everything' }}
        run: |
          mkdir -p "$NXF_SINGULARITY_CACHEDIR"
          # shellcheck disable=SC2086  # NFT_CHANGED is empty or two words, unquoted on purpose
          nf-test test \
            --profile=+${{ matrix.profile }} \
            --ci \
            $NFT_CHANGED \
            --verbose \
            --tap=test.tap \
            --shard ${{ matrix.shard }}/${{ needs.nf-test-changes.outputs.total_shards }}

      - name: Offline image names match Nextflow's
        # utils/pull_singularity_images.sh re-creates Nextflow's file naming for
        # cached Singularity images (for offline use, docs/offline.md). Every image
        # in the cache after the tests must have a name the script gives it: the
        # script filled the cache first, so if Nextflow names an image differently
        # it pulls its own copy under that name, and the check below fails.
        if: matrix.profile == 'singularity'
        run: |
          shopt -s nullglob
          cached=("$NXF_SINGULARITY_CACHEDIR"/*.img)
          if [ ${#cached[@]} -eq 0 ]; then echo "No images cached in this shard; nothing to compare."; exit 0; fi
          utils/pull_singularity_images.sh --list > expected_images.tsv
          bad=0
          for f in "${cached[@]}"; do
            name=$(basename "$f")
            if ! cut -f2 expected_images.tsv | grep -qxF "$name"; then
              echo "::error::Nextflow cached '$name', a name utils/pull_singularity_images.sh doesn't produce"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] && echo "All ${#cached[@]} images Nextflow cached have the names the script gives them."
          exit "$bad"

      - name: Note a failure with the latest Nextflow (not a failed check)
        if: ${{ always() && steps.run_nf_test.outcome == 'failure' && matrix.NXF_VER == 'latest-everything' }}
        run: |
          echo "::warning::nf-test failed with Nextflow latest-everything (${{ matrix.profile }}, shard ${{ matrix.shard }}). This doesn't fail the check; see if the next Nextflow release needs a change."
          echo "## ⚠️ Failed with Nextflow latest-everything: ${{ matrix.profile }}, shard ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Test summary
        if: always()
        run: |
          echo "| Status | Test | Engine | Nextflow | Shard |" >> "$GITHUB_STEP_SUMMARY"
          echo "|:-:|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          if [ -f test.tap ]; then
            grep -E '^(not )?ok' test.tap | while IFS= read -r line; do
              case "$line" in
                ok*)     s="✅"; t="${line#ok }" ;;
                not\ ok*) s="❌"; t="${line#not ok }" ;;
              esac
              echo "| $s | ${t#* } | ${{ matrix.profile }} | ${{ matrix.NXF_VER }} | ${{ matrix.shard }} |" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

      - name: Upload the pipeline test's trace and report
        # Per-step run times of tests/default.nf.test, to see what makes it slow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-info-${{ matrix.profile }}-${{ matrix.NXF_VER }}-${{ matrix.shard }}
          path: .nf-test/tests/*/output/pipeline_info/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload logs and snapshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-${{ matrix.profile }}-${{ matrix.NXF_VER }}-${{ matrix.shard }}
          path: |
            .nf-test/tests/*/meta/nextflow.log
            .nf-test/tests/*/work/*/*/.command.*
            tests/default.nf.test.snap
          if-no-files-found: ignore
          retention-days: 7

  confirm-pass:
    needs: [nf-test-changes, nf-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: One or more tests failed (excluding latest-everything)
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
      - name: One or more tests cancelled
        if: ${{ contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: All tests ok, or none related to this change
        run: echo "nf-test-changes ${{ needs.nf-test-changes.result }}, nf-test ${{ needs.nf-test.result }}"

name: Run Pipeline Tests

# Real end-to-end run of the pipeline on test_chlamydia (10 Chlamydia
# genomes, close enough for CAFE5 to actually converge — see README's test
# profile table; test_bacteria is faster but never converges), on every PR
# targeting main, via nf-test's pipeline-level snapshot test
# (tests/default.nf.test). Checks
# workflow.success plus that output structure/content matches the committed
# snapshot (tests/default.nf.test.snap), not just that nothing crashed.
#
# Not a stub run — most CAFE/GO modules don't have stub: blocks yet, so a
# -stub-run would feed real downstream processes with fake upstream output.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NXF_VER: 26.04.6
  NFT_VER: 0.9.5

jobs:
  test:
    runs-on: ubuntu-latest
    # CAFE_RUN_K requests 8 CPUs/task (process_high) but only 4 real cores
    # exist on this runner, so the 6-way k-sweep that's designed to run in
    # parallel instead runs fully serially, roughly 6x a single fit's
    # duration. Generous margin here rather than risk another ~45min
    # round-trip to a too-tight timeout.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4.1.1

      - name: Set up JDK 17
        uses: actions/setup-java@v4.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -v

      - name: Install nf-test
        run: |
          curl -fsSL https://code.askimed.com/install/nf-test | bash
          sudo mv nf-test /usr/local/bin/
          nf-test version

      - name: Run nf-test
        run: nf-test test tests/default.nf.test --ci --verbose

      # Always upload, whether or not a committed snapshot exists yet — lets a
      # freshly (re)generated snapshot be pulled down and reviewed/committed,
      # and gives something to inspect when a comparison against an existing
      # snapshot fails.
      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-snapshot
          path: tests/default.nf.test.snap
          if-no-files-found: warn

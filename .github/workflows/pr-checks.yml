name: PR checks

# Fast checks for every pull request, whatever branch it targets:
#   lint          nextflow lint, schema duplicate keys, syntax of the scripts in bin/ and utils/
#   module-tests  every tests/*/main.nf.test, under Docker and under Singularity
#
# The full test_chlamydia pipeline run (test-pipeline.yml, ~1 h) is not run
# here. Start it on a PR branch by hand when a PR changes how the pipeline
# fits together:
#   gh workflow run test-pipeline.yml --ref <branch>

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NXF_VER: 26.04.6
  NFT_VER: 0.9.5
  NXF_ANSI_LOG: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.1.1

      - name: Set up JDK 17
        uses: actions/setup-java@v4.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -v

      - name: Nextflow lint
        # Errors fail the check; the existing warnings don't.
        run: nextflow lint main.nf modules/local conf nextflow.config

      - name: nextflow_schema.json has no duplicate keys
        # Python's json module silently keeps the last of two equal keys, but
        # Nextflow refuses to start.
        run: |
          python3 - <<'PY'
          import json, sys
          def no_dupes(pairs):
              keys = [k for k, _ in pairs]
              dupes = sorted({k for k in keys if keys.count(k) > 1})
              if dupes:
                  sys.exit("nextflow_schema.json: duplicate key(s): " + ", ".join(dupes))
              return dict(pairs)
          json.load(open("nextflow_schema.json"), object_pairs_hook=no_dupes)
          print("nextflow_schema.json: OK")
          PY

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Install BioPerl
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bioperl > /dev/null

      - name: Script syntax
        run: |
          status=0
          for f in bin/*.py; do python3 -m py_compile "$f" || { echo "::error file=$f::Python syntax error"; status=1; }; done
          for f in bin/*.pl; do perl -c "$f" > /dev/null || { echo "::error file=$f::Perl syntax error"; status=1; }; done
          for f in bin/*.R; do Rscript -e "invisible(parse('$f'))" || { echo "::error file=$f::R syntax error"; status=1; }; done
          for f in bin/*.sh utils/*.sh; do [ -e "$f" ] || continue; bash -n "$f" || { echo "::error file=$f::shell syntax error"; status=1; }; done
          exit $status

  module-tests:
    name: module tests (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, singularity]
    steps:
      - uses: actions/checkout@v4.1.1

      - name: Set up JDK 17
        uses: actions/setup-java@v4.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -v

      - name: Install nf-test
        # From nf-test's GitHub releases. The code.askimed.com installer stopped resolving.
        uses: nf-core/setup-nf-test@v2.1.0
        with:
          version: ${{ env.NFT_VER }}

      - name: Install Apptainer (provides the singularity command)
        if: matrix.engine == 'singularity'
        # v2 of this action installs a .deb that needs libfuse3-3, which current
        # ubuntu-latest runners no longer have.
        uses: eWaterCycle/setup-apptainer@v3.0.0
        with:
          apptainer-version: 1.5.5

      - name: Run module tests
        # Every module-level test, so a new one is picked up without editing this
        # file. tests/default.nf.test (the full pipeline) is run by test-pipeline.yml.
        run: |
          ls tests/*/main.nf.test
          nf-test test tests/*/main.nf.test --profile test_chlamydia,${{ matrix.engine }} --ci --verbose

      - name: Upload Nextflow logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-logs-${{ matrix.engine }}
          path: |
            .nf-test/tests/*/meta/nextflow.log
            .nf-test/tests/*/work/*/*/.command.*
          if-no-files-found: ignore
          retention-days: 7
